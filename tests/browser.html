<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Solar site browser checks</title>
    <style>
      body {
        font: 15px/1.45 system-ui;
        margin: 20px;
        color: #162326;
        background: #ecf0ee;
      }
      h1 {
        font-weight: 550;
        font-size: 24px;
      }
      button,
      select {
        font: inherit;
        padding: 6px 12px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 14px 0;
      }
      th,
      td {
        text-align: left;
        border-bottom: 1px solid #bbc3c0;
        padding: 6px 8px;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
      }
      iframe {
        border: 0;
        display: block;
        transform-origin: 0 0;
      }
      #frameHost {
        background: #d1d8d6;
        overflow: hidden;
        max-width: 100%;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Solar site browser checks</h1>
    <div id="controls">
      <button id="run">Run six viewports</button
      ><label>Inspect viewport<select id="viewport"></select></label
      ><button id="inspect">Show preview</button>
    </div>
    <p id="status" role="status">Ready</p>
    <table>
      <thead>
        <tr>
          <th>Viewport</th>
          <th>Overflow</th>
          <th>Film</th>
          <th>Interactions</th>
          <th>Accessibility violations</th>
          <th>Frame FCP</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <pre id="diagnostics"></pre>
    <div id="frameHost"></div>
    <script type="module" src="./browser-suite.js"></script>
  </body>
</html>
